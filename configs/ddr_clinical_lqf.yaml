# Clinical-LQF on DDR (training configuration)
# Run from the repository root; data paths may use ${DATA_ROOT}/...

paths:
  master_csv: ${DATA_ROOT}/ddr_grading_master.csv
  stats_csv: ${DATA_ROOT}/lesion_stats.csv
  output_dir: outputs/ddr_clinical_lqf
  pretrained_encoder: pretrained/convnext_base.fb_in22k_ft_in1k_384_encoder.pth

model:
  backbone_name: convnext_base.fb_in22k_ft_in1k_384
  out_indices: [1, 2, 3]
  evidence_dim: 512
  lesion_dim: 256
  stats_dim: 18
  aux_head_weight: 0.15
  clinical_dropout: 0.1
  hr_gate_alpha: 0.3
  hr_gate_detach: true
  lesion_ms_detach_prob: true
  lesion_ms_dropout: 0.1

data:
  img_size: 768
  num_classes: 5

augmentation:
  crop_scale: [0.8, 1.0]
  rotation_deg: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

loss:
  ce_weight_mode: none
  w_cls: 1.0
  w_ord: 0.4
  w_reg: 0.4
  w_relation: 0.2
  w_burden: 0.1
  relation_tau: 0.7

inference:
  w_prob: 0.5
  w_reg: 0.5

train:
  epochs: 100
  warmup_epochs: 10
  keep_top_k_checkpoints: 2
  batch_size: 8
  grad_accum_steps: 4
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  num_workers: 8
  seed: 42
  amp: true
  use_data_parallel: false
  use_weighted_sampler: true

threshold_search:
  n_random_samples: 12000
  seed: 42
  objective: mean
  qwk_weight: 0.5
  acc_weight: 0.5
